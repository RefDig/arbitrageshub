name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.VPS_SSH_KEY }}
        known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

    - name: Deploy via SSH
      run: |
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/builderlys && git pull && ./deploy.sh"